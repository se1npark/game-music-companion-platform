services:
  postgres:
    image: postgres:16-alpine
    container_name: game-music-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_music_companion
    ports:
      - "5433:5432"
    volumes:
      - game-music-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_music_companion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  game-music-postgres:
